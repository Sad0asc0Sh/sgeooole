# pnpm settings for admin (standalone project).
# NOTE: pnpm >= 11 reads settings ONLY from this file, not from package.json.

pmOnFail: ignore   # keep `packageManager` pin without polluting pnpm-lock.yaml

# Packages allowed to run install/build scripts.
allowBuilds:
  esbuild: true

overrides:
  "@babel/core": "^7.29.0"
  "axios": "^1.19.0"
  "esbuild": "^0.25.0"
  "fast-uri": "^3.1.3"
  "form-data": "^4.0.6"
  "postcss": "^8.5.17"
  "quill": "2.0.2"
  "@remix-run/router": "^1.23.3"
