# =============================================
# NGINX SECURITY HARDENED CONFIGURATION
# Domain: ekgkala.ir
# Nginx Version: 1.24.0+
# Last Updated: 2026
# =============================================

# Hide Nginx version in error pages and headers
server_tokens off;

# Rate Limiting Zones
# =============================================
# Zone for general API requests: 10 req/sec per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Zone for auth endpoints: 1 req/min per IP (strict for brute force prevention)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/m;

# Zone for general requests: 30 req/sec per IP
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Connection limit per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream configuration for Next.js
upstream nextjs_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# =============================================
# HTTP Server - Redirect to HTTPS
# =============================================
server {
    listen 80;
    listen [::]:80;
    server_name ekgkala.ir www.ekgkala.ir;

    # Allow Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# =============================================
# HTTPS Server - Main Configuration
# =============================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ekgkala.ir www.ekgkala.ir;

    # Root directory
    root /var/www/ekgkala.ir/public;
    client_max_body_size 50M;

    # =============================================
    # SSL Certificate Configuration (Certbot/Let's Encrypt)
    # =============================================
    ssl_certificate /etc/letsencrypt/live/ekgkala.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ekgkala.ir/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ekgkala.ir/chain.pem;

    # =============================================
    # SSL Protocol Hardening - CRITICAL
    # Only allow TLS 1.2 and TLS 1.3 (disable TLS 1.0 and 1.1)
    # =============================================
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Strong Cipher Suites (prioritize modern ciphers)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    
    # Server chooses cipher, not client
    ssl_prefer_server_ciphers on;
    
    # SSL Session Configuration
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Diffie-Hellman parameter (generate with: openssl dhparam -out /etc/nginx/dhparam.pem 2048)
    ssl_dhparam /etc/nginx/dhparam.pem;

    # =============================================
    # Security Headers
    # =============================================
    # HSTS (HTTP Strict Transport Security) - with preload
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS Protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://ekgkala.ir; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://ekgkala.ir https://*.ekgkala.ir; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # Remove identifying headers (requires headers-more module)
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';

    # Connection Limits
    limit_conn conn_limit 10;

    # Logging
    access_log /var/log/nginx/ekgkala.ir-access.log;
    error_log /var/log/nginx/ekgkala.ir-error.log warn;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Security: Disable directory listing
    autoindex off;

    # =============================================
    # Sensitive Pages - NO CACHE
    # =============================================
    location ~ ^/(admin|profile|dashboard|checkout) {
        limit_req zone=general_limit burst=5 nodelay;
        
        # Force no caching
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        # Security headers (must be repeated in location blocks)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Remove Next.js header
        proxy_hide_header X-Powered-By;
    }

    # =============================================
    # Product CSV Import - larger body + longer timeout
    # =============================================
    location = /api/products/import/csv {
        limit_req zone=api_limit burst=10 nodelay;

        add_header Cache-Control "no-store, max-age=0" always;

        proxy_request_buffering off;
        proxy_buffering off;

        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_send_timeout 900s;
        proxy_read_timeout 900s;

        proxy_hide_header X-Powered-By;
    }

    # =============================================
    # Auth Endpoints - STRICT RATE LIMITING
    # =============================================
    location ~ ^/api/auth/ {
        # 1 request per minute per IP (very strict for auth)
        limit_req zone=auth_limit burst=2 nodelay;
        
        # No caching
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_hide_header X-Powered-By;
    }

    # =============================================
    # General API Endpoints - MODERATE RATE LIMITING
    # =============================================
    location ~ ^/api/ {
        # 10 requests per second per IP
        limit_req zone=api_limit burst=20 nodelay;
        
        # No caching for API
        add_header Cache-Control "no-store, max-age=0" always;
        
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_hide_header X-Powered-By;
    }

    # =============================================
    # Next.js Static Assets (_next/)
    # =============================================
    location /_next/static/ {
        limit_req zone=general_limit burst=50 nodelay;
        
        # Long-term caching for static assets
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_hide_header X-Powered-By;
    }

    # =============================================
    # Public static files
    # =============================================
    location /static/ {
        limit_req zone=general_limit burst=50 nodelay;
        
        add_header Cache-Control "public, max-age=31536000, immutable";
        alias /var/www/ekgkala.ir/public/static/;
    }

    # =============================================
    # Favicon and robots.txt
    # =============================================
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=86400";
    }

    # =============================================
    # Block access to hidden files
    # =============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =============================================
    # Block access to sensitive files
    # =============================================
    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =============================================
    # Default location - Proxy to Next.js
    # =============================================
    location / {
        limit_req zone=general_limit burst=10 nodelay;
        
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_hide_header X-Powered-By;
    }

    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
