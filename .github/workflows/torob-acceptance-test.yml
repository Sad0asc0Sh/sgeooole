name: Torob API V3 Acceptance Test

# این workflow فقط با یک MongoDB موقت و ایزوله (سرویس‌کانتینر GitHub Actions) کار می‌کند.
# هیچ اتصالی به دیتابیس واقعی/production (چه لوکال روی سرور، چه Atlas) در این فایل وجود ندارد یا نباید اضافه شود.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'ekgkala-backend/controllers/torobController.js'
      - 'ekgkala-backend/utils/torobMapper.js'
      - 'ekgkala-backend/middleware/torobAuth.js'
      - 'ekgkala-backend/jobs/torobFeedCache.js'
      - 'ekgkala-backend/routes/torob.js'
      - 'ekgkala-backend/models/Product.js'
      - 'ekgkala-backend/tests/torob-acceptance.js'
      # Re-run when the install/CI setup itself changes (pnpm migration safety net).
      - 'ekgkala-backend/package.json'
      - 'ekgkala-backend/pnpm-lock.yaml'
      - 'ekgkala-backend/pnpm-workspace.yaml'
      - '.github/workflows/torob-acceptance-test.yml'

jobs:
  torob-e2e:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # این آدرس فقط به سرویس‌کانتینر موقت همین job اشاره دارد؛ هرگز به production تغییر داده نشود.
      MONGODB_URI: mongodb://127.0.0.1:27017/torob_acceptance_test
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      TOROB_TOKEN_VERSION: '1'
      FRONTEND_URL: https://www.ekgkala.ir

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned, action-free pnpm install: the pnpm setup actions changed shape between pnpm 10 -> 11 -> 12
      # (pnpm/action-setup vs pnpm/setup, v1..v3, auto-`pnpm install`), so a plain npm install of the
      # exact version from "packageManager" is the lowest-risk option. Keep in sync with package.json.
      - name: Install pnpm (pinned)
        run: npm install -g pnpm@12.8.1

      - name: Install backend dependencies
        working-directory: ekgkala-backend
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral RSA test keypair (used only inside this job)
        run: |
          openssl genrsa -out /tmp/torob_test_private.pem 2048
          openssl rsa -in /tmp/torob_test_private.pem -pubout -out /tmp/torob_test_public.pem
          {
            echo "TOROB_PUBLIC_KEY<<TOROB_KEY_EOF"
            cat /tmp/torob_test_public.pem
            echo "TOROB_KEY_EOF"
          } >> "$GITHUB_ENV"

      - name: Run Torob acceptance suite (seed + server + 8 scenarios)
        working-directory: ekgkala-backend
        run: node tests/torob-acceptance.js
        env:
          TOROB_TEST_PRIVATE_KEY_PATH: /tmp/torob_test_private.pem

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torob-acceptance-report
          path: ekgkala-backend/torob-acceptance-report.json
          if-no-files-found: warn
