# =========================================================
# Nginx Anti-Abuse & Rate Limiting Configuration (Self-Hosted)
# Place rate limiting directives in http context and server context.
# =========================================================

# 1. Add to http {} block in /etc/nginx/nginx.conf or /etc/nginx/conf.d/rate_limit.conf:
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general_api_limit:10m rate=60r/m;
limit_req_status 429;

# 2. Add to server {} block inside your site configuration:
# Protection for authentication & OTP routes
location /api/auth/ {
    limit_req zone=auth_limit burst=5 nodelay;

    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

# Protection for general API routes
location /api/ {
    limit_req zone=general_api_limit burst=20 nodelay;

    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}
